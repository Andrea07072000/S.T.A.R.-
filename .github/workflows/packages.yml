name: packages

# Every S.T.A.R. package under packages/ is installed in a fresh environment and its own tests are run, on every push.
# This is the independent reproduction of the results claimed in each package README: a GitHub-hosted runner, not the
# authors' machine. Tests that need tools absent from the runner (Orekit in WSL, Renode) skip and say so (-rs).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [conjunction_screen_sgp4, star_audit, star_cdm, star_crosscheck, star_elements, star_geodesy, star_lambert, star_maneuver, star_orbit,
                  star_sidereal, star_tdb, star_telemetry, star_telemetry_c]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install star-timescales (repository root) and sibling packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip install ./packages/star_geodesy
      - name: Install the package and its test-only cross-check libraries
        run: |
          python -m pip install "./packages/${{ matrix.package }}"
          if [ "${{ matrix.package }}" = "star_telemetry" ]; then python -m pip install ccsdspy spacepackets; fi
          if [ "${{ matrix.package }}" = "star_telemetry_c" ]; then
            # the C library is built from source with -Werror and compared with the Python reference: natively (x86_64)
            # and, through qemu-user, on two more ISAs. Embedded boards (Renode) are not on the runner: those tests skip.
            sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu qemu-user
          fi
      - name: Run the package tests
        working-directory: packages/${{ matrix.package }}
        run: |
          set -o pipefail
          python -m pytest -q -rs -p no:cacheprovider | tee pytest.out
          # public summary (visible without signing in): the result line and every skip with its reason
          { echo "### ${{ matrix.package }} (Python ${{ matrix.python }})"; echo '```'; grep -E "^(SKIPPED|[0-9]+ (passed|failed))" pytest.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The C library must really be built and checked here, not skipped
        if: matrix.package == 'star_telemetry_c'
        working-directory: packages/star_telemetry_c
        run: |
          python -m pytest -q -rs -p no:cacheprovider test_contract_sanitized.py "test_c_vs_python.py::test_c_matches_python_on_native_and_corrupted_frames[x86_64]" "test_c_vs_python.py::test_c_matches_python_on_native_and_corrupted_frames[aarch64]" "test_c_vs_python.py::test_c_matches_python_on_native_and_corrupted_frames[riscv64]" | tee c.out
          grep -q "^7 passed" c.out || { echo "C checks were skipped or failed"; exit 1; }
