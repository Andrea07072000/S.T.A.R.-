name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install . pytest pyerfa
      - name: Test (including the ERFA cross-check)
        run: python -m pytest -q -rs
      - name: Use it like a user (installed package, outside the source tree)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -m star_timescales 2026-09-28T00:00:00Z | tee out.txt
          grep -q "TAI - UTC       37 s" out.txt
          grep -q "JD / MJD        2461311.500000 / 61311.000000" out.txt
          set +e
          python -m star_timescales 2030-01-01T00:00:00Z 2> err.txt
          code=$?
          set -e
          cat err.txt
          test "$code" -eq 2
          grep -q "update it from IERS Bulletin C" err.txt
          python -c "from star_timescales import tai_minus_utc; from datetime import datetime, timezone; assert tai_minus_utc(datetime(2026, 9, 28, tzinfo=timezone.utc)) == 37"
