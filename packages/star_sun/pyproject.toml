[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-sun"
version = "0.1.0"
description = "S.T.A.R. low-precision Sun vector (1950-2050), orbit beta angle and cylindrical eclipse test, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_sun"]
