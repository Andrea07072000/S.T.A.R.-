[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-era"
version = "0.1.1"
description = "S.T.A.R. Earth Rotation Angle (IAU 2000) and Greenwich Mean Sidereal Time (IAU 2006) from two-part Julian Dates, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_era"]
