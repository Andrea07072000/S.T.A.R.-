[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-telemetry"
version = "0.2.7"
description = "S.T.A.R. Space Systems: CCSDS AOS/TM transfer frame deframer and Space Packet reassembler independently verified against NASA JPL F Prime."
requires-python = ">=3.9"
dependencies = ["star-timescales>=0.2.0"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest", "ccsdspy"]

[tool.setuptools]
packages = ["star_telemetry"]
package-dir = {"star_telemetry" = "."}
