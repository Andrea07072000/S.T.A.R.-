[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-wrap"
version = "0.1.0"
description = "S.T.A.R. angle reduction to [0, 360) and [-180, 180), shortest signed difference and circular mean, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_wrap"]
