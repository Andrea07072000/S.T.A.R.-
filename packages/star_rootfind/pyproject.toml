[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-rootfind"
version = "0.1.0"
description = "S.T.A.R. bracketed roots of a real function by bisection over the floats: no tolerance, at most 64 evaluations, explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_rootfind"]
