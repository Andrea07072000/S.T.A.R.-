[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-j2"
version = "0.1.0"
description = "S.T.A.R. secular effect of the Earth's oblateness (J2): node and perigee rates, nodal period, sun-synchronous and critical inclination, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_j2"]
