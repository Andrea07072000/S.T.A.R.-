[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-units"
version = "0.1.0"
description = "S.T.A.R. unit conversion with exact definitions and a dimension check: a conversion between different dimensions is an error, not a number."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_units"]
