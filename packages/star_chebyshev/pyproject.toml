[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-chebyshev"
version = "0.1.0"
description = "S.T.A.R. value and first derivative of a Chebyshev series on an interval given by midpoint and radius (the ephemeris convention), with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_chebyshev"]
