[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-anomaly"
version = "0.1.0"
description = "S.T.A.R. Kepler's equation and conversions between mean, eccentric, hyperbolic and true anomaly, accurate near the parabola, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_anomaly"]
