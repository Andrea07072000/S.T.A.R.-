[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-polyfit"
version = "0.1.0"
description = "S.T.A.R. least-squares polynomial fit (degree 0 to 10, weighted or not) solved in exact arithmetic and rounded once, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_polyfit"]
