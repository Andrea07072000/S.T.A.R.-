[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-geodesic"
version = "0.1.0"
description = "S.T.A.R. geodesics on WGS-84: distance and azimuths between two points and the point reached from a start, with bounded iterations and explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_geodesic"]
