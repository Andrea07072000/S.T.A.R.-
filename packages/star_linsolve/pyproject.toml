[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-linsolve"
version = "0.1.0"
description = "S.T.A.R. determinant, solution and inverse of small square systems (order 1 to 20) in exact arithmetic, rounded once, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_linsolve"]
