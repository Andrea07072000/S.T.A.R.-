[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-coverage"
version = "0.1.0"
description = "S.T.A.R. coverage geometry of a satellite over a spherical body: central angle, nadir angle, slant range, footprint and elevation, precise from grazing altitudes to deep space."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_coverage"]
