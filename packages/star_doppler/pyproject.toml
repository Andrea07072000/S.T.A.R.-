[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-doppler"
version = "0.1.0"
description = "S.T.A.R. range and range rate between two states and the one-way Doppler-shifted frequency, relativistic or first order, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_doppler"]
