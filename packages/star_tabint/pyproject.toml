[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-tabint"
version = "0.1.0"
description = "S.T.A.R. trapezoid rule, running integral and composite Simpson rule of tabulated data, evaluated exactly and rounded once, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_tabint"]
