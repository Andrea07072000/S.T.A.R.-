[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-quaternion"
version = "0.1.0"
description = "S.T.A.R. unit quaternions and rotation matrices with one stated convention (scalar first, active rotation), checked against NAIF SPICE and SciPy, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_quaternion"]
