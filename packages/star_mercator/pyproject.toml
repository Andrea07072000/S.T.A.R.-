[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-mercator"
version = "0.1.0"
description = "S.T.A.R. Mercator projection on the ellipsoid (forward, inverse, scale factor) and Web Mercator, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_mercator"]
