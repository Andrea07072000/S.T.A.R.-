[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-twobody"
version = "0.1.0"
description = "S.T.A.R. period, mean motion, circular and escape speed, apsis radii and speeds and specific energy of a Keplerian ellipse, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_twobody"]
