[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-galactic"
version = "0.1.0"
description = "S.T.A.R. equatorial-galactic conversion of directions (Hipparcos ICRS and IAU 1958 B1950 definitions), with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_galactic"]
