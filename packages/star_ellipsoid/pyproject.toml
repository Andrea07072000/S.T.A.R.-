[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-ellipsoid"
version = "0.1.0"
description = "S.T.A.R. WGS-84 ellipsoid as a surface: radii of curvature, geocentric radius, auxiliary latitudes and meridian arc, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_ellipsoid"]
