[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-sexagesimal"
version = "0.1.0"
description = "S.T.A.R. degrees to and from degrees/minutes/seconds and hours/minutes/seconds, rounded once so a field never shows 60, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_sexagesimal"]
