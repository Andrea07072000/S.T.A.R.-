[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-precession"
version = "0.1.0"
description = "S.T.A.R. IAU 1976 precession between J2000 and the mean equator and equinox of date, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_precession"]
