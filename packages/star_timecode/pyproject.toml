[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-timecode"
version = "0.1.0"
description = "S.T.A.R. strict reader and writer of CCSDS ASCII time codes A and B (calendar and day-of-year), with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_timecode"]
