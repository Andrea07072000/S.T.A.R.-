[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-mat3"
version = "0.1.0"
description = "S.T.A.R. 3x3 matrix operations: exact determinant and inverse, products, transpose and a proper-rotation test, with explicit refusals."
requires-python = ">=3.9"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
py-modules = ["star_mat3"]
